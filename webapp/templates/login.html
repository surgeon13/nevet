{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<form method="post" class="login-form">
  <h2>Login</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="password" name="password" placeholder="Password" autofocus>
  <button type="submit">Log in</button>
</form>
{% endblock %}
