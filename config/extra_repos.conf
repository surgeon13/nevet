# Companion repos that live next to Nevet and update with it.
#
# Every update check (scripts/auto_update.sh -> scripts/update_extras.sh)
# clones each repo listed here into ~/nevet-extras/<name> the first time,
# then keeps it on the latest version of its branch. The web app serves
# them at /extras/<name>/ (only the names listed here).
#
# Format, one per line:  name  git-url  [branch, default main]
acid  https://github.com/surgeon13/kg13-acid-space  main
