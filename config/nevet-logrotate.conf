# Rotates the bash-generated logs under logs/ (capture.log, watchdog.log).
# webapp.log rotates on its own via Python's RotatingFileHandler and
# doesn't need an entry here. Installed to /etc/logrotate.d/nevet by
# install.sh - path below is a template, rendered with the real home dir.
__HOME__/camera_captures/logs/capture.log __HOME__/camera_captures/logs/watchdog.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
